let currentChapter=-1,currentType='all',answers={};

function loadAnswers(){try{const d=localStorage.getItem('xi_thought_answers');if(d)answers=JSON.parse(d)}catch(e){}}
function saveAnswers(){localStorage.setItem('xi_thought_answers',JSON.stringify(answers))}

function renderNav(){
const nav=document.getElementById('navList');
let html='<div class="nav-item'+(currentChapter===-1?' active':'')+'" onclick="selectChapter(-1)">全部 <span class="count">('+questions.length+')</span></div>';
chapters.forEach((ch,i)=>{
const cnt=questions.filter(q=>q.chapter===i).length;
if(cnt>0) html+='<div class="nav-item'+(currentChapter===i?' active':'')+'" onclick="selectChapter('+i+')">'+ch+' <span class="count">('+cnt+')</span></div>';
});
nav.innerHTML=html;
}

function selectChapter(ch){currentChapter=ch;renderNav();renderQuestions()}

function getFiltered(){
let qs=questions;
if(currentChapter>=0) qs=qs.filter(q=>q.chapter===currentChapter);
if(currentType!=='all') qs=qs.filter(q=>q.type===currentType);
return qs;
}

function renderQuestions(){
const qs=getFiltered();
const area=document.getElementById('questionArea');
if(!qs.length){area.innerHTML='<div class="empty-tip">暂无题目</div>';updateStats();return}
let html='';
qs.forEach(q=>{
const a=answers[q.id];
const answered=!!a;
const isCorrect=answered&&checkCorrect(q,a);
const cardCls=answered?(isCorrect?'correct':'wrong'):'';
const typeLabel=q.type==='single'?'单选题':q.type==='multiple'?'多选题':'填空题';
const typeCls=q.type;
html+='<div class="q-card '+cardCls+'" id="qcard_'+q.id+'">';
html+='<div class="q-header"><div class="q-num">'+q.id+'</div><span class="q-type '+typeCls+'">'+typeLabel+'</span><div class="q-text">'+q.question+'</div></div>';
if(q.type==='single'){
html+='<div class="options">';
q.options.forEach((opt,oi)=>{
const chk=answered&&a.includes(oi)?'checked':'';
html+='<label class="option-item"><input type="radio" name="q_'+q.id+'" value="'+oi+'" '+chk+' '+(answered?'disabled':'')+' onchange="selectSingle('+q.id+','+oi+')">'+opt+'</label>';
});
html+='</div>';
if(!answered) html+='<div class="submit-row"><button class="submit-btn" onclick="submitSingle('+q.id+')">提交答案</button></div>';
}else if(q.type==='multiple'){
html+='<div class="options">';
q.options.forEach((opt,oi)=>{
const chk=answered&&a.includes(oi)?'checked':'';
html+='<label class="option-item"><input type="checkbox" name="q_'+q.id+'" value="'+oi+'" '+chk+' '+(answered?'disabled':'')+' onchange="selectMultiple('+q.id+')">'+opt+'</label>';
});
html+='</div>';
if(!answered) html+='<div class="submit-row"><button class="submit-btn" onclick="submitMultiple('+q.id+')">提交答案</button></div>';
}else{
const val=answered?a:'';
const cls=answered?(isCorrect?'correct':'wrong'):'';
html+='<div class="fill-input"><input type="text" id="fill_'+q.id+'" placeholder="请输入答案" value="'+val+'" '+(answered?'disabled':'')+' class="'+cls+'"></div>';
if(!answered) html+='<div class="submit-row"><button class="submit-btn" onclick="submitFill('+q.id+')">提交答案</button></div>';
}
const expShow=answered?'show':'';
const tagCls=isCorrect?'correct-tag':'wrong-tag';
const tagText=isCorrect?'正确':'错误';
html+='<div class="explanation '+expShow+'"><span class="tag '+tagCls+'">'+tagText+'</span>'+q.explanation+'</div>';
html+='</div>';
});
area.innerHTML=html;
updateStats();
}

function checkCorrect(q,a){
if(q.type==='single') return a.length===1&&a[0]===q.answer[0];
if(q.type==='multiple'){if(a.length!==q.answer.length)return false;return q.answer.every(x=>a.includes(x))}
if(q.type==='fill') return a.trim()===q.answer;
return false;
}

function selectSingle(qid,idx){
answers[qid]=[idx];saveAnswers();
}
function submitSingle(qid){
const boxes=document.querySelectorAll('input[name="q_'+qid+'"]');
let val=-1;boxes.forEach(b=>{if(b.checked)val=parseInt(b.value)});
if(val===-1){alert('请选择一个选项');return}
answers[qid]=[val];saveAnswers();renderQuestions();
}
function selectMultiple(qid){
const boxes=document.querySelectorAll('input[name="q_'+qid+'"]');
const vals=[];boxes.forEach(b=>{if(b.checked)vals.push(parseInt(b.value))});
answers[qid]=vals;saveAnswers();
}
function submitMultiple(qid){
const boxes=document.querySelectorAll('input[name="q_'+qid+'"]');
const vals=[];boxes.forEach(b=>{if(b.checked)vals.push(parseInt(b.value))});
if(!vals.length){alert('请至少选择一个选项');return}
answers[qid]=vals;saveAnswers();renderQuestions();
}
function submitFill(qid){
const inp=document.getElementById('fill_'+qid);
const val=inp.value.trim();
if(!val){alert('请输入答案');return}
answers[qid]=val;saveAnswers();renderQuestions();
}

function updateStats(){
const total=questions.length;
const answeredQs=questions.filter(q=>answers[q.id]!==undefined);
const answered=answeredQs.length;
const correct=answeredQs.filter(q=>checkCorrect(q,answers[q.id])).length;
const wrong=answered-correct;
const rate=answered?Math.round(correct/answered*100)+'%':'0%';
document.getElementById('statTotal').textContent=total;
document.getElementById('statAnswered').textContent=answered;
document.getElementById('statCorrect').textContent=correct;
document.getElementById('statRate').textContent=rate;
document.getElementById('statWrong').textContent=wrong;
const pct=total?Math.round(answered/total*100):0;
document.getElementById('progressText').textContent='进度: '+answered+'/'+total;
document.getElementById('progressPercent').textContent=pct+'%';
document.getElementById('progressFill').style.width=pct+'%';
}

function showWrongBook(){
const wrongQs=questions.filter(q=>answers[q.id]!==undefined&&!checkCorrect(q,answers[q.id]));
const modal=document.getElementById('wrongModal');
const list=document.getElementById('wrongList');
if(!wrongQs.length){list.innerHTML='<div style="text-align:center;padding:30px;color:#aaa">没有错题，继续加油！</div>';modal.classList.add('show');return}
let html='';
wrongQs.forEach(q=>{
const a=answers[q.id];
const typeLabel=q.type==='single'?'单选题':q.type==='multiple'?'多选题':'填空题';
html+='<div class="q-card wrong">';
html+='<div class="q-header"><div class="q-num">'+q.id+'</div><span class="q-type '+q.type+'">'+typeLabel+'</span><div class="q-text">'+q.question+'</div></div>';
if(q.type==='fill'){
html+='<div style="padding-left:38px;font-size:14px;margin-top:6px;">你的答案：<span style="color:#f44336">'+a+'</span> | 正确答案：<span style="color:#4caf50">'+q.answer+'</span></div>';
}else{
html+='<div style="padding-left:38px;font-size:14px;margin-top:6px;">你的答案：'+a.map(i=>q.options[i]).join('、')+'<br>正确答案：'+q.answer.map(i=>q.options[i]).join('、')+'</div>';
}
html+='<div class="explanation show" style="margin-left:38px;margin-top:10px"><span class="tag wrong-tag">错误</span>'+q.explanation+'</div>';
html+='</div>';
});
list.innerHTML=html;modal.classList.add('show');
}
function closeModal(){document.getElementById('wrongModal').classList.remove('show')}

function doRestart(){
if(!confirm('确定要清除所有答题记录吗？'))return;
answers={};saveAnswers();renderQuestions();
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
btn.addEventListener('click',function(){
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
this.classList.add('active');
currentType=this.dataset.type;renderQuestions();
});
});

document.getElementById('wrongModal').addEventListener('click',function(e){if(e.target===this)closeModal()});

loadAnswers();renderNav();renderQuestions();
</script>
